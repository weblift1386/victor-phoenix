<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Victor Phoenix — Create What's Next.</title>

  <meta
    name="description"
    content="Victor Phoenix creates digital experiences, technology, creative design and AI-powered solutions."
  >

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #050505;
      color: #ffffff;
      line-height: 1.6;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    img {
      max-width: 100%;
      display: block;
    }

    .container {
      width: min(1180px, 92%);
      margin: auto;
    }

    /* NAVIGATION */

    nav {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 1000;
      background: rgba(5, 5, 5, 0.82);
      backdrop-filter: blur(18px);
      border-bottom: 1px solid #1d1d1d;
    }

    .nav-inner {
      min-height: 82px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 30px;
    }

    .brand {
      display: flex;
      align-items: center;
      width: 150px;
    }

    .brand img {
      width: 150px;
      height: auto;
      object-fit: contain;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 28px;
      font-size: 14px;
      color: #bcbcbc;
    }

    .nav-links a:hover {
      color: #ffffff;
    }

    .nav-button {
      border: 1px solid #ffffff;
      padding: 11px 18px;
      border-radius: 30px;
      color: #ffffff;
    }

    /* HERO */

    .hero {
      min-height: 100vh;
      display: flex;
      align-items: center;
      position: relative;
      overflow: hidden;
      padding-top: 110px;
    }

    .hero-content {
      position: relative;
      z-index: 3;
      max-width: 760px;
    }

    .eyebrow {
      color: #999999;
      text-transform: uppercase;
      letter-spacing: 4px;
      font-size: 12px;
      margin-bottom: 25px;
    }

    .hero h1 {
      font-size: clamp(58px, 9vw, 125px);
      line-height: 0.9;
      letter-spacing: -7px;
      font-weight: 800;
      margin-bottom: 35px;
    }

    .hero h1 span {
      color: #8d8d8d;
    }

    .hero-text {
      max-width: 650px;
      color: #b5b5b5;
      font-size: 19px;
      line-height: 1.8;
      margin-bottom: 40px;
    }

    .buttons {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 15px 25px;
      border-radius: 40px;
      border: 1px solid #555555;
      transition: 0.25s ease;
      font-size: 14px;
    }

    .button.primary {
      background: #ffffff;
      color: #000000;
      border-color: #ffffff;
    }

    .button:hover {
      transform: translateY(-3px);
      border-color: #ffffff;
    }

    .orb {
      position: absolute;
      right: -100px;
      top: 50%;
      transform: translateY(-50%);
      width: 520px;
      height: 520px;
      border-radius: 50%;
      background:
        radial-gradient(circle at 30% 25%, #ffffff 0%, #777777 12%, #292929 35%, #090909 68%);
      box-shadow:
        inset -50px -40px 100px #000000,
        0 0 100px rgba(255,255,255,0.08);
      opacity: 0.9;
    }

    .orb::before,
    .orb::after {
      content: "";
      position: absolute;
      inset: -30px;
      border: 1px solid #2b2b2b;
      border-radius: 50%;
      transform: rotate(25deg);
    }

    .orb::after {
      inset: -60px;
      transform: rotate(-25deg);
      opacity: 0.5;
    }

    /* SECTIONS */

    section {
      padding: 120px 0;
      border-top: 1px solid #181818;
    }

    .section-heading {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 30px;
      margin-bottom: 55px;
    }

    .section-heading h2 {
      font-size: clamp(38px, 6vw, 72px);
      line-height: 1;
      letter-spacing: -3px;
    }

    .section-heading p {
      max-width: 440px;
      color: #999999;
    }

    /* SERVICES */

    .services-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 18px;
    }
