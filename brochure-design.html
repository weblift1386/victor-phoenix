<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Brochure Design — Victor Phoenix</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #050505;
      color: #f5f5f5;
      line-height: 1.6;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 6%;
      background: rgba(5, 5, 5, 0.88);
      backdrop-filter: blur(18px);
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }

    .logo {
      width: 150px;
      max-width: 42vw;
      display: block;
    }

    .back {
      font-size: 14px;
      color: #aaa;
      transition: 0.3s;
    }

    .back:hover {
      color: #fff;
    }

    .hero {
      padding: 110px 6% 70px;
      max-width: 1200px;
      margin: auto;
    }

    .hero span {
      color: #888;
      text-transform: uppercase;
      letter-spacing: 3px;
      font-size: 12px;
    }

    .hero h1 {
      font-size: clamp(48px, 8vw, 100px);
      line-height: 0.95;
      margin: 18px 0 25px;
      letter-spacing: -5px;
    }

    .hero p {
      max-width: 720px;
      color: #aaa;
      font-size: 17px;
    }

    .catalogue {
      width: 88%;
      max-width: 1250px;
      margin: auto;
    }

    .brochure-card {
      margin-bottom: 90px;
      padding: 35px;
      border: 1px solid rgba(255,255,255,0.09);
      border-radius: 28px;
      background: linear-gradient(
        145deg,
        rgba(255,255,255,0.055),
        rgba(255,255,255,0.015)
      );
      box-shadow: 0 30px 80px rgba(0,0,0,0.35);
    }

    .brochure-info {
      margin-bottom: 30px;
    }

    .tag {
      display: inline-block;
      padding: 7px 11px;
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 100px;
      color: #aaa;
      font-size: 11px;
      margin-bottom: 15px;
    }

    .brochure-info h2 {
      font-size: clamp(28px, 4vw, 48px);
      line-height: 1.05;
      margin-bottom: 12px;
    }

    .size {
      color: #ddd;
      font-size: 14px;
      margin-bottom: 14px;
      letter-spacing: 1px;
    }

    .brochure-info p {
      color: #999;
      max-width: 720px;
    }

    .brochure-preview {
      width: 100%;
      display: flex;
      justify-content: center;
      padding: 35px;
      margin-bottom: 30px;
      background: #090909;
      border-radius: 22px;
      overflow: hidden;
    }

    .brochure {
      position: relative;
      width: min(850px, 100%);
      min-height: 360px;
      padding: 35px;
      overflow: hidden;
      border-radius: 8px;
      background:
        linear-gradient(135deg, #151515, #343434);
      box-shadow:
        0 25px 70px rgba(0,0,0,0.65),
        inset 0 0 0 1px rgba(255,255,255,0.1);
    }

    .brochure-content {
      position: relative;
      z-index: 3;
      max-width: 55%;
    }

    .concept {
      display: inline-block;
      font-size: 9px;
      letter-spacing: 2px;
      color: #aaa;
      margin-bottom: 25px;
    }

    .brochure h3 {
      font-size: clamp(30px, 5vw, 58px);
      line-height: 0.95;
      letter-spacing: -3px;
      margin-bottom: 18px;
    }

    .brochure p {
      color: #c7c7c7;
      font-size: 14px;
      max-width: 360px;
    }

    .brochure strong {
      display: inline-block;
      margin-top: 25px;
      font-size: 11px;
      letter-spacing: 1px;
    }

    .brochure-visual {
      position: absolute;
      right: 7%;
      top: 50%;
      transform: translateY(-50%);
      width: 230px;
      height: 280px;
    }

    .orb {
      position: absolute;
      width: 190px;
      height: 190px;
      right: 0;
      top: 35px;
      border-radius: 50%;
      background:
        radial-gradient(circle at 35% 30%,
        #fff,
        #999 18%,
        #444 48%,
        #111 75%);
      box-shadow: 0 0 70px rgba(255,255,255,0.12);
    }

    .ring {
      position: absolute;
      width: 240px;
      height: 85px;
      border: 1px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      right: -25px;
      top: 95px;
      transform: rotate(-22deg);
    }

    .packages {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
    }

    .package {
      padding: 25px;
      border-radius: 18px;
      border: 1px solid rgba(255,255,255,0.08);
      background: rgba(255,255,255,0.025);
    }

    .package h3 {
      font-size: 18px;
      margin-bottom: 8px;
    }

    .price {
      font-size: 28px;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .package p {
      color: #999;
      font-size: 13px;
      margin-bottom: 6px;
    }

    .start {
      display: inline-block;
      margin-top: 18px;
      font-size: 11px;
      letter-spacing: 1px;
      padding-bottom: 5px;
      border-bottom: 1px solid #777;
      transition: 0.3s;
    }

    .start:hover {
      color: #bbb;
      border-color: #fff;
    }

    .contact {
      width: 88%;
      max-width: 1250px;
      margin: 40px auto 100px;
      padding: 90px 40px;
      text-align: center;
      border-radius: 30px;
      background: linear-gradient(
        145deg,
        #171717,
        #080808
      );
      border: 1px solid rgba(255,255,255,0.1);
    }

    .contact h2 {
      font-size: clamp(38px, 6vw, 75px);
      letter-spacing: -3px;
      margin-bottom: 15px;
    }

    .contact p {
      color: #999;
      margin-bottom: 30px;
    }

    .contact-btn {
      display: inline-block;
      padding: 16px 25px;
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 100px;
      font-size: 12px;
      letter-spacing: 1px;
      transition: 0.3s;
    }

    .contact-btn:hover {
      background: #fff;
      color: #000;
    }

    footer {
      text-align: center;
      padding: 30px 20px;
      color: #666;
      font-size: 12px;
      border-top: 1px solid rgba(255,255,255,0.08);
    }

    @media (max-width: 800px) {
      .packages {
        grid-template-columns: 1fr;
      }

      .brochure {
        min-height: 430px;
      }

      .brochure-content {
        max-width: 65%;
      }

      .brochure-visual {
        right: -30px;
        opacity: 0.75;
      }
    }

    @media (max-width: 520px) {
      .hero {
        padding-top: 80px;
      }

      .brochure-card {
        padding: 20px;
      }

      .brochure-preview {
        padding: 15px;
      }

      .brochure {
        min-height: 380px;
        padding: 25px;
      }

      .brochure-content {
        max-width: 100%;
      }

      .brochure-visual {
        opacity: 0.22;
      }
    }
  </style>
</head>

<body>

<header>
  <a href="index.html">
    <img src="logo.png" class="logo" alt="Victor Phoenix">
  </a>

  <a href="graphics.html" class="back">
    ← Graphics & Design
  </a>
</header>

<section class="hero">
  <span>Victor Phoenix Creative</span>

  <h1>Brochure Design.</h1>

  <p>
    Professional brochures designed to present businesses,
    products, services, properties, organisations and ideas
    with a polished visual structure.
  </p>
</section>
